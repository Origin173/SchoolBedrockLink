# SchoolBedrockLink 0.1.0
#
# This is Blessing Skin mode. The Blessing Skin instance is intentionally not
# hard-coded: fill in the URLs for the instance used by your school.

http:
  bind-address: "127.0.0.1"
  port: 8787
  public-base-url: "http://127.0.0.1:8787"
  request-timeout-seconds: 10

development-mode: true

oauth:
  mode: "blessing-skin"

  # Fill these with the URLs of your Blessing Skin instance. They are blank on
  # purpose so this plugin never assumes a particular school domain.
  authorization-url: ""
  token-url: ""
  user-endpoint: ""
  players-endpoint: ""
  yggdrasil-profiles-endpoint: ""

  # Use the Client ID generated by the Blessing Skin OAuth application.
  client-id: "CHANGE_ME"
  # Put the real secret in SCHOOL_BEDROCK_OAUTH_SECRET, not in this file.
  client-secret: "${ENV:SCHOOL_BEDROCK_OAUTH_SECRET}"
  # Leave empty only if the installed OAuth provider grants the required API
  # access without an explicit scope. Otherwise list your provider's exact scope
  # names:
  #   - Blessing Skin's built-in OAuth2 (Passport): use
  #     ["User.Read", "Player.Read"] (both: the default User.Read scope applies
  #     only when the request carries no scope at all).
  #   - A site running the Yggdrasil Connect plugin: requesting any Yggdrasil.*
  #     scope without "openid" is rejected at /oauth/authorize with
  #     invalid_scope. Use ["openid", "Yggdrasil.PlayerProfiles.Read"].
  # When unsure, read scopes_supported from the provider's discovery document
  # (<issuer>/.well-known/openid-configuration).
  scopes: []
  pkce: true

binding:
  code-length: 10
  code-expire-seconds: 300
  reuse-existing-code: true
  auto-repair-missing-floodgate-link: true

rate-limit:
  enabled: true
  per-ip-per-minute: 30
  oauth-start-per-code: 5

messages:
  # {link} is the complete URL incl. the code: opening it starts OAuth directly, so the
  # player never retypes the code. {url} + {code} stay available as the manual fallback
  # for clients that render the disconnect screen without tappable links.
  unlinked: |
    §e校园 Minecraft 身份认证

    §f你的 Xbox 账号还没有绑定学校 Minecraft 账号。

    §f点开这个链接就能直接认证：
    §b{link}

    §f如果不能点击，请打开 §b{url}
    §f认证码：
    §a{code}

    §7认证码 {minutes} 分钟内有效。
    §7认证完成以后重新进入服务器。
  repaired: |
    §a账号绑定已经自动修复。
    §f请重新连接服务器。
  conflict: |
    §c账号绑定发生冲突。
    §f请联系服务器管理员。
  not-ready: |
    §c校园身份认证服务暂时不可用。
    §f请稍后重试；如果持续出现，请联系服务器管理员。
