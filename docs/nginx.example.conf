server {
    listen 443 ssl;
    server_name mc-auth.example.edu;

    # Configure ssl_certificate and ssl_certificate_key for your domain.

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Single trusted edge: overwrite caller-controlled forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        client_max_body_size 16k;
        proxy_read_timeout 300s;
        # OAuth query strings contain credentials; do not use default access logs here.
        access_log off;
    }
}

# Do not expose 8787 directly to the Internet. The plugin intentionally binds
# to localhost by default; let Nginx terminate HTTPS and proxy to it.
# If public-base-url has /auth, use location /auth/ with the same proxy_pass
# WITHOUT a trailing slash, retaining /auth in the upstream request URI.
# CDN/multiple-proxy deployments need an audited real_ip trusted-network setup;
# never trust arbitrary client X-Forwarded-For or Forwarded values.
