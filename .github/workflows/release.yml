name: Release

# 推一个 v* 标签（例如 v0.2.0）即自动构建并发布 GitHub Release，
# 也可以在 Actions 页面手动触发，由工作流创建标签。
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，例如 0.2.0）'
        required: true
        type: string
      prerelease:
        description: '标记为 Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION:-}"
            if [ "$REF" != "refs/heads/master" ]; then
              echo "::error::手动发布必须从 master 触发，当前是 $REF"
              exit 1
            fi
          else
            version="${REF_NAME#v}"
          fi
          version_re='^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)*$'
          if [[ ! "$version" =~ $version_re ]]; then
            echo "::error::版本号 '$version' 不合法，应形如 0.2.0 或 0.2.0-rc1"
            exit 1
          fi
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac
          if [ "${INPUT_PRERELEASE:-false}" = "true" ]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "版本号 $version，标签 v$version，pre-release=$prerelease"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew clean test build -Pversion="$VERSION" --console=plain

      - name: Verify plugin JAR
        id: jar
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jar="build/libs/SchoolBedrockLink-${VERSION}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::未找到构建产物 $jar"
            ls -l build/libs
            exit 1
          fi
          if ! unzip -p "$jar" plugin.yml | grep -qE "version: *'?${VERSION}'?[[:space:]]*$"; then
            echo "::error::plugin.yml 中的版本号与 ${VERSION} 不一致"
            unzip -p "$jar" plugin.yml | head -n 5
            exit 1
          fi
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar")" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
        run: |
          set -euo pipefail
          bash .github/scripts/changelog.sh "$TAG" > changelog.md
          {
            printf '\n## 📦 安装\n\n'
            printf -- '- 需要 Paper 26.2（Java 25）与 Floodgate；把 `%s` 放进服务端 `plugins/` 目录后重启。\n' "$JAR_NAME"
            printf -- '- 首次安装与验收步骤见 README 的「快速部署」和 `docs/acceptance.md`。\n'
          } >> changelog.md
          cat changelog.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolBedrockLink-${{ steps.version.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SchoolBedrockLink ${{ steps.version.outputs.version }}
          body_path: changelog.md
          # 更新日志由 .github/scripts/changelog.sh 按提交前缀分组生成，不用 GitHub 的默认生成结果
          generate_release_notes: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: ${{ steps.jar.outputs.path }}
          fail_on_unmatched_files: true
